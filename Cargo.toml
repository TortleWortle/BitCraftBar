[package]
name = "bitcraft-tracker"
version = "0.0.11"
edition = "2024"
description = "Tray app showing the status of a BitCraft character (data from BitJita). Rust/GPUI port of the macOS BitCraftTrackerBar."
license = "MIT"
# Update check: latest GitHub release of this repository (`net::api::latest_release`).
repository = "https://github.com/TortleWortle/BitCraftBar"
publish = false

[[bin]]
name = "bitcraft-tracker"
path = "src/main.rs"

[dependencies]
# `runtime_shaders`: compile Metal shaders at runtime on macOS, so building
# doesn't need Xcode's Metal toolchain.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
anyhow = "1"
async-channel = "2"
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
notify-rust = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "charset"] }
# One TLS crypto provider for reqwest + websockets, installed in main().
# `ring` (not aws-lc) because it builds without cmake/NASM on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: relay rows arrive as objects in column order (relay.rs).
serde_json = { version = "1", features = ["preserve_order"] }
raw-window-handle = "0.6"
tiny-skia = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rodio = { version = "0.20", default-features = false }

# Tray icon: the D-Bus StatusNotifierItem backend on Linux (no GTK needed;
# works on KDE, and on GNOME with the AppIndicator extension).
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

# macOS: native window/screen bits GPUI lacks (platform.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSRunningApplication", "NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSGeometry", "NSString", "objc2-core-foundation"] }

# Windows: DPI for converting tray coordinates to logical pixels.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

# GPUI is big; skip debug info and incremental caches to keep `target/` small.
[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true

# gpui 0.2.2 → zed-async-tar → xattr 0.2.3, which uses `libc::ENOATTR`;
# libc 0.2.19x no longer has it on Linux (build error). Patched copy uses
# ENODATA there (same value). Remove once gpui no longer pulls xattr 0.2.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
